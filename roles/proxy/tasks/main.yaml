- name: Copy SSL certificate file (proxy)
  copy:
    src: "{{ base_path }}/ssl/{{ inventory_hostname }}/{{ item.src }}"
    dest: "{{ base_path }}/skale-proxy/data/{{ item.dest }}"
    remote_src: true
    mode: "0600"
  loop:
    - { src: "fullchain.pem", dest: "server.crt" }
    - { src: "privkey.pem", dest: "server.key" }

- name: Write proxy environment
  copy:
    content: |
      ENDPOINT={{ eth_endpoint }}
      ETH_ENDPOINT={{ eth_endpoint }}
      MANAGER_CONTRACTS={{ manager_contracts }}
      NETWORK_NAME={{ network_name }}
      HEARTBEAT_URL={{ heartbeat_url | default('') }}
      USE_ALB={{ use_alb | bool }}
      COMPOSE_PROFILES=metrics
    dest: "{{ base_path }}/skale-proxy/.env"
    mode: "0600"

- name: Run proxy
  command: docker compose up -d --build --remove-orphans --force-recreate
  args:
    chdir: "{{ base_path }}/skale-proxy"
