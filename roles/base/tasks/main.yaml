- name: Copy authorized_keys to {{ base_path }}/.ssh
  copy:
    src: "files/authorized_keys"
    dest: "{{ base_path }}/.ssh"

- name: Set soft ulimits
  pam_limits:
    domain: root
    limit_type: soft
    limit_item: core
    value: "1000000000"
  tags: ulimits

- name: Set hard ulimits
  pam_limits:
    domain: root
    limit_type: hard
    limit_item: core
    value: "1000000000"
  tags: ulimits

- name: Install packages
  apt:
    name:
      - ca-certificates
      - iptables-persistent
      - systemd-timesyncd
    state: latest
    update_cache: true
  tags: apt

- import_tasks: docker.yaml
  tags: docker

- name: Enable timesyncd service
  systemd:
    name: systemd-timesyncd
    enabled: true
    state: started
  tags: ntp
